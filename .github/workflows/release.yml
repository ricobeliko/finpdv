name: Release Mercearia Uber

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Signing Key
        shell: node {0}
        run: |
          const fs = require('fs');
          const rawKey = (process.env.RAW_KEY || '').trim().replace(/[\r\n\s]+/g, '');
          const rawPass = (process.env.RAW_PASS || '').trim().replace(/[\r\n]+/g, '');
          fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${rawKey}\nTAURI_SIGNING_PRIVATE_KEY_PASSWORD=${rawPass}\n`, { encoding: 'utf-8' });
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mercearia Uber ${{ github.ref_name }}'
          releaseBody: 'Atualização automática do sistema Mercearia Uber.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
