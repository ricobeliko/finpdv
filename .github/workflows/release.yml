name: Release Mercearia Uber

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Normalize Signing Key
        shell: pwsh
        run: |
          $raw = $env:SECRET_KEY.Trim()
          if ($raw.StartsWith("untrusted")) {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($raw + "`n")
            $b64 = [System.Convert]::ToBase64String($bytes)
          } else {
            $b64 = $raw.Replace("`r", "").Replace("`n", "").Trim()
          }
          "TAURI_SIGNING_PRIVATE_KEY=$b64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          SECRET_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mercearia Uber ${{ github.ref_name }}'
          releaseBody: 'Atualização automática do sistema Mercearia Uber.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
