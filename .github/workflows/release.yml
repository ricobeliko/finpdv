name: Release FinPDV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Signing Key
        shell: node {0}
        run: |
          const fs = require('fs');
          const rawKey = (process.env.RAW_KEY || '').trim().replace(/[\r\n\s]+/g, '');
          const rawPass = (process.env.RAW_PASS || '').trim().replace(/[\r\n]+/g, '');
          fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${rawKey}\nTAURI_SIGNING_PRIVATE_KEY_PASSWORD=${rawPass}\n`, { encoding: 'utf-8' });
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Extract Release Notes
        id: notes
        shell: node {0}
        run: |
          const fs = require('fs');
          let notes = '';
          if (fs.existsSync('RELEASE_NOTES.md')) {
            const content = fs.readFileSync('RELEASE_NOTES.md', 'utf-8');
            const tag = '${{ github.ref_name }}';
            const version = tag.replace(/^v/, '');
            const regex = new RegExp(`##\\s*\\[?v?${version}\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n##|$)`, 'i');
            const match = content.match(regex);
            if (match && match[1].trim()) {
              notes = match[1].trim();
            } else {
              notes = content.trim();
            }
          }
          if (!notes) {
            notes = '- Consulta de produtos via Bluesoft Cosmos por código de barras\n- Classificação inteligente de categorias sem falso positivo\n- Suporte à tecla ESC no modal de cadastro e edição de produtos\n- Relatório dinâmico de novidades no assistente de atualização\n- Melhorias de estabilidade e desempenho';
          }
          const delimiter = 'EOF_' + Math.random().toString(36).substring(2);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${notes}\n${delimiter}\n`);

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FinPDV ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

